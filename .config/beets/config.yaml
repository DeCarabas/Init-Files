directory: /zmain/media/music
library: /zmain/media/music/musiclibrary.db
plugins: ftintitle fetchart embedart lyrics chroma convert mbsync edit hook
import:
    move: yes
convert:
    dest: /var/media/mp3
    auto_keep: yes
    copy_album_art: yes
    embed: yes
    never_convert_lossy_files: yes

# Refresh Gepetto's voice-search index the moment an import lands (the
# 20-minute cron is the backstop).
hook:
    hooks:
        - event: import
          command: /home/doty/src/monorepo/gepetto/deploy/music-index.sh
